<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Editar usuário</title>
  <link rel="stylesheet" href="/CSS/editar-motorista.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <div class="perfil-usuario">
            <div class="avatar-usuario">--</div>
            <span class="nome-usuario">...</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Editar usuário</h2>
          <p class="subtitulo-pagina">Atualize dados, perfil e vínculo com motorista.</p>
        </div>
      </section>

      <section class="painel-formulario">
        <div class="formulario-motorista" id="formUsuario">
          <div class="grade-formulario">
            <div class="grupo-campo">
              <label for="campoNome">Nome completo</label>
              <input type="text" id="campoNome" maxlength="255" required placeholder="Nome do usuário" />
            </div>
            <div class="grupo-campo">
              <label for="campoEmail">E-mail</label>
              <input type="email" id="campoEmail" maxlength="255" required placeholder="email@exemplo.com" />
            </div>
            <div class="grupo-campo">
              <label for="campoPerfil">Perfil</label>
              <select id="campoPerfil" required disabled>
                <option value="motorista">Motorista</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <div class="grupo-campo" id="grupoMotoristaVinculo">
              <label for="campoMotoristaId">Motorista vinculado</label>
              <select id="campoMotoristaId">
                <option value="">— Selecione —</option>
              </select>
            </div>
            <div class="grupo-campo campo-checkbox-compacto">
              <input type="checkbox" id="campoAtivo" checked />
              <label for="campoAtivo">Usuário ativo</label>
            </div>
          </div>
          <div class="acoes-formulario">
            <a href="configuracoes.html?secao=usuarios" class="botao-secundario"
              style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">Cancelar</a>
            <button type="button" class="botao-primario" id="botaoSalvar">Salvar alterações</button>
          </div>
          <p id="msgErro" class="mensagem-retorno" style="display:none;"></p>
        </div>
      </section>
    </main>
  </div>

   <script src="/JavaScript/utils/navbar.js?v=3"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
  <script src="/JavaScript/master-contexto.js"></script>
  <script src="/JavaScript/editar-usuario.js"></script>
</body>

</html>
