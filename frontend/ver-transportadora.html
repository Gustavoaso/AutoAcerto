<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Detalhes da Transportadora</title>
  <link rel="stylesheet" href="/CSS/ver-transportadora.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Detalhes da Transportadora</h2>
          <p class="subtitulo-pagina">Informações completas da transportadora cadastrada.</p>
        </div>
        <div class="acoes-cabecalho">
          <button type="button" class="botao-secundario" id="botaoVoltar">Voltar</button>
          <button type="button" class="botao-primario" id="botaoEditar">Editar</button>
        </div>
      </section>

      <section class="painel-detalhes">
        <div class="cabecalho-transportadora">
          <div class="avatar-transportadora-grande">🚚</div>
          <div>
            <h3 class="nome-transportadora-grande" id="detalheNome">—</h3>
            <p class="cnpj-transportadora" id="detalheCnpjTopo">—</p>
          </div>
        </div>

        <div class="grade-detalhes-transportadoras">
          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Nome</span>
            <span class="valor-detalhe" id="detalheNomeGrid">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">CNPJ</span>
            <span class="valor-detalhe" id="detalheCnpj">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Status</span>
            <span class="valor-detalhe" id="detalheStatus">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Data de cadastro</span>
            <span class="valor-detalhe" id="detalheDataCadastro">—</span>
          </div>
        </div>
      </section>
    </main>
  </div>

   <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
  <script src="/JavaScript/ver-transportadora.js"></script>
</body>

</html>
