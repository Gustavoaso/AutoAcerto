<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAcerto - Motoristas</title>
    <link rel="stylesheet" href="/CSS/motoristas.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="layout-principal">
        <aside class="barra-lateral"></aside>

        <main class="conteudo-principal">
            <header class="topo-pagina">
                <div class="campo-busca-topo">
                    <input type="text" placeholder="Pesquisar no sistema..." />
                </div>

                <div class="acoes-topo">
                    <button class="botao-icone">🔔</button>
                    <div class="perfil-usuario">
                        <div class="avatar-usuario">GS</div>
                        <span class="nome-usuario">Gustavo</span>
                    </div>
                </div>
            </header>

            <section class="cabecalho-conteudo">
                <div>
                    <h2 class="titulo-pagina">Motoristas</h2>
                    <p class="subtitulo-pagina">Gerencie os motoristas cadastrados no sistema.</p>
                </div>

                <button class="botao-primario" id="botaoNovoMotorista">+ Novo motorista</button>
            </section>

            <section class="grade-resumo">
                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo roxo">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21a8 8 0 0 0-16 0" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Total de motoristas</span>
                    </div>
                    <strong class="valor-resumo" id="totalMotoristas">0</strong>
                </div>

                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo verde">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21a8 8 0 0 0-16 0" />
                                <circle cx="12" cy="7" r="4" />
                                <path d="M9 17l2 2 4-4" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Motoristas ativos</span>
                    </div>
                    <strong class="valor-resumo" id="totalAtivos">0</strong>
                </div>

                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo azul">
                            <svg viewBox="0 0 24 24">
                                <rect x="4" y="5" width="16" height="14" rx="2" />
                                <path d="M8 9h8M8 13h5" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Com CNH informada</span>
                    </div>
                    <strong class="valor-resumo" id="totalCnhValida">0</strong>
                </div>

                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo cinza">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8" />
                                <path d="M9 9l6 6M15 9l-6 6" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Inativos</span>
                    </div>
                    <strong class="valor-resumo" id="totalInativos">0</strong>
                </div>
            </section>

            <section class="painel">
                <div class="cabecalho-painel">
                    <div>
                        <h3>Lista de Motoristas</h3>
                        <p class="texto-auxiliar">Consulte, pesquise e acompanhe os registros cadastrados.</p>
                    </div>
                </div>

                <div class="barra-filtros">
                    <div class="campo-filtro">
                        <label for="campoPesquisaMotorista">Pesquisar</label>
                        <input type="text" id="campoPesquisaMotorista" placeholder="Nome, CPF, telefone ou CNH" />
                    </div>

                    <div class="campo-filtro">
                        <label style="visibility: hidden;" aria-hidden="true">Filtro</label>
                        <div class="grupo-filtro-segmentado">
                            <button class="botao-toggle-filtro" id="botaoToggleStatusMotorista" type="button" aria-expanded="false" aria-controls="filtroStatus">
                                <span>Status</span>
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
                            </button>
                            <div class="filtro-segmentado filtro-segmentado-fechado" id="filtroStatus">
                                <button class="botao-segmentado ativo" data-valor="todos">Todos</button>
                                <button class="botao-segmentado" data-valor="ativo">Ativo</button>
                                <button class="botao-segmentado" data-valor="inativo">Inativo</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tabela-responsiva">
                    <table class="tabela-motoristas">
                        <thead>
                            <tr>
                                <th class="coluna-selecao"><input type="checkbox" data-selecionar-todos-motoristas aria-label="Selecionar todos"></th>
                                <th>Motorista</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>CNH</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaMotoristas"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

     <script src="/JavaScript/utils/navbar.js?v=3"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
    <script src="/JavaScript/exclusao-listas.js"></script>
    <script src="/JavaScript/motoristas.js"></script>
</body>

</html>
