<head>
  <meta charset="UTF-8" />

<body>

    <aside class="barra-lateral">
      <div class="icone-logo">
        <img src="/Imagens/logo-autoacerto.png" alt="AutoAcerto" class="imagem-logo">
      </div>
      <nav class="menu-lateral">

            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Dashboard
        </a>
        <a href="motoristas.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Motoristas
        </a>
        <a href="veiculos.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13" rx="1" />
            <path d="M16 8h4l3 5v3h-7V8z" />
            <circle cx="5.5" cy="18.5" r="2.5" />
            <circle cx="18.5" cy="18.5" r="2.5" />
          </svg>
          Veículos
        </a>
        <a href="viagens.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          Viagens
        </a>
        <a href="despesas.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
          Despesas
        </a>
        <a href="relatorios.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          Relatórios
        </a>
        <a href="configuracoes.html" class="item-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          Configurações
        </a>
      </nav>
      <div class="rodape-barra">
        <button class="botao-sair" type="button">Sair</button>
      </div>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <div class="perfil-usuario">
            <div class="avatar-usuario">--</div>
            <span class="nome-usuario">...</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Novo usuário</h2>
          <p class="subtitulo-pagina">Cadastre um usuário com perfil de administrador ou motorista.</p>
        </div>
      </section>

      <section class="painel-formulario">
        <div class="formulario-motorista" id="formUsuario">
          <div class="grade-formulario">
            <div class="grupo-campo">
              <label for="campoNome">Nome completo</label>
              <input type="text" id="campoNome" maxlength="255" required placeholder="Nome do usuário" />
            </div>
            <div class="grupo-campo">
              <label for="campoEmail">E-mail</label>
              <input type="email" id="campoEmail" maxlength="255" required placeholder="email@exemplo.com" />
            </div>
            <div class="grupo-campo">
              <label for="campoPerfil">Perfil</label>
              <select id="campoPerfil" required>
                <option value="motorista">Motorista</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <div class="grupo-campo" id="grupoMotoristaVinculo">
              <label for="campoMotoristaId">Motorista vinculado</label>
              <select id="campoMotoristaId">
                <option value="">— Selecione —</option>
              </select>
            </div>
            <div class="grupo-campo">
              <label for="campoSenha">Senha</label>
              <input type="password" id="campoSenha" minlength="8" maxlength="128" required
                placeholder="Mínimo 8 caracteres" />
            </div>
            <div class="grupo-campo campo-checkbox-compacto">
              <input type="checkbox" id="campoAtivo" checked />
              <label for="campoAtivo">Usuário ativo</label>
            </div>
          </div>
          <div class="acoes-formulario">
            <a href="configuracoes.html?secao=usuarios" class="botao-secundario"
              style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">Cancelar</a>
            <button type="button" class="botao-primario" id="botaoSalvar">Salvar</button>
          </div>
          <p id="msgErro" class="mensagem-retorno" style="display:none;"></p>
        </div>
      </section>
    </main>
  </div>

   <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
  <script src="/JavaScript/master-contexto.js"></script>
  <script src="/JavaScript/novo-usuario.js"></script>
</body>

</html>
