<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Detalhes da Viagem</title>
  <link rel="stylesheet" href="/CSS/ver-viagem.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Detalhes da Viagem</h2>
          <p class="subtitulo-pagina">Informações completas da viagem registrada.</p>
        </div>
        <div class="acoes-cabecalho">
          <button type="button" class="botao-secundario" id="botaoVoltar">Voltar</button>
          <button type="button" class="botao-primario botao-sucesso oculto" id="botaoConcluirViagem">Concluir viagem</button>
          <button type="button" class="botao-secundario" id="botaoLancarDespesa">Lançar despesa</button>
          <button type="button" class="botao-primario" id="botaoEditar">Editar</button>
        </div>
      </section>

      <section class="painel-detalhes">
        <div class="grade-detalhes">

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Origem</span>
            <span class="valor-detalhe" id="detalheOrigem">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Destino</span>
            <span class="valor-detalhe" id="detalheDestino">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Motorista</span>
            <span class="valor-detalhe" id="detalheMotorista">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Veículo</span>
            <span class="valor-detalhe" id="detalheVeiculo">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Data de saída</span>
            <span class="valor-detalhe" id="detalheDataSaida">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Data de chegada</span>
            <span class="valor-detalhe" id="detalheDataChegada">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Valor do frete</span>
            <span class="valor-detalhe" id="detalheValorFrete">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Status</span>
            <span class="valor-detalhe" id="detalheStatus">—</span>
          </div>

          <div class="grupo-detalhe grupo-detalhe-largo">
            <span class="rotulo-detalhe">Observações</span>
            <span class="valor-detalhe" id="detalheObservacoes">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Data de cadastro</span>
            <span class="valor-detalhe" id="detalheDataCadastro">—</span>
          </div>

        </div>
      </section>
    </main>
  </div>

   <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/utils/regras-negocio.js"></script>
  <script src="/JavaScript/utils/viagem-acoes.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>


  <script src="/JavaScript/ver-viagem.js"></script>
</body>

</html>
