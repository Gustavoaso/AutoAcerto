<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAcerto - Veículos</title>
    <link rel="stylesheet" href="/CSS/veiculos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="layout-principal">
        <aside class="barra-lateral"></aside>

        <main class="conteudo-principal">
            <header class="topo-pagina">
                <div class="acoes-topo">
                    <button class="botao-icone">🔔</button>
                    <div class="perfil-usuario">
                        <div class="avatar-usuario">GS</div>
                        <span class="nome-usuario">Gustavo</span>
                    </div>
                </div>
            </header>

            <section class="cabecalho-conteudo">
                <div>
                    <h2 class="titulo-pagina">Veículos</h2>
                    <p class="subtitulo-pagina">Gerencie os veículos cadastrados e acompanhe a situação da frota.</p>
                </div>
                <button class="botao-primario" id="botaoNovoVeiculo">+ Novo veículo</button>
            </section>

            <section class="grade-resumo">
                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo azul">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 17h4V5H2v12h3" />
                                <path d="M14 8h4l4 4v5h-3" />
                                <circle cx="7.5" cy="17.5" r="2.5" />
                                <circle cx="16.5" cy="17.5" r="2.5" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Total de veículos</span>
                    </div>
                    <strong class="valor-resumo" id="totalVeiculos">0</strong>
                </div>
                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo verde">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 17h4V5H2v12h3" />
                                <path d="M14 8h4l4 4v5h-3" />
                                <circle cx="7.5" cy="17.5" r="2.5" />
                                <circle cx="16.5" cy="17.5" r="2.5" />
                                <path d="M6 12l2 2 4-4" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Veículos ativos</span>
                    </div>
                    <strong class="valor-resumo" id="totalVeiculosAtivos">0</strong>
                </div>
                <div class="card-resumo">
                    <div class="topo-card">
                        <span class="icone-card-resumo cinza">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 17h4V5H2v12h3" />
                                <path d="M14 8h4l4 4v5h-3" />
                                <circle cx="7.5" cy="17.5" r="2.5" />
                                <circle cx="16.5" cy="17.5" r="2.5" />
                                <path d="M6.5 6.5l11 11" />
                            </svg>
                        </span>
                        <span class="rotulo-resumo">Veículos inativos</span>
                    </div>
                    <strong class="valor-resumo" id="totalVeiculosInativos">0</strong>
                </div>
            </section>

            <section class="painel">
                <div class="cabecalho-painel">
                    <div>
                        <h3>Lista de Veículos</h3>
                        <p class="texto-auxiliar">Pesquise, filtre e acompanhe os dados da frota.</p>
                    </div>
                </div>

                <div class="barra-filtros">
                    <div class="campo-filtro">
                        <label for="campoPesquisaVeiculo">Pesquisar</label>
                        <input type="text" id="campoPesquisaVeiculo" placeholder="Placa, modelo ou observações" />
                    </div>
                    <div class="campo-filtro">
                        <label style="visibility: hidden;" aria-hidden="true">Filtro</label>
                        <div class="grupo-filtro-segmentado">
                            <button class="botao-toggle-filtro" id="botaoToggleStatusVeiculo" type="button" aria-expanded="false" aria-controls="filtroStatusVeiculo">
                                <span>Status</span>
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
                            </button>
                            <div class="filtro-segmentado filtro-segmentado-fechado" id="filtroStatusVeiculo">
                                <button class="botao-segmentado ativo" data-valor="todos">Todos</button>
                                <button class="botao-segmentado" data-valor="ativo">Ativo</button>
                                <button class="botao-segmentado" data-valor="inativo">Inativo</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tabela-responsiva">
                    <table class="tabela-veiculos">
                        <thead>
                            <tr>
                                <th class="coluna-selecao"><input type="checkbox" data-selecionar-todos-veiculos aria-label="Selecionar todos"></th>
                                <th>Veículo</th>
                                <th>Placa</th>
                                <th>Ano</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaVeiculos"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

     <script src="/JavaScript/utils/navbar.js?v=3"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
    <script src="/JavaScript/exclusao-listas.js"></script>
    <script src="/JavaScript/mascaras.js"></script>
    <script src="/JavaScript/veiculos.js"></script>
</body>

</html>
