<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAcerto - Detalhes do Motorista</title>
    <link rel="stylesheet" href="/CSS/ver-motorista.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="layout-principal">
        <aside class="barra-lateral"></aside>

        <main class="conteudo-principal">
            <header class="topo-pagina">
                <div class="acoes-topo">
                    <button class="botao-icone" type="button">🔔</button>
                    <div class="perfil-usuario">
                        <div class="avatar-usuario">GS</div>
                        <span class="nome-usuario">Gustavo</span>
                    </div>
                </div>
            </header>

            <section class="cabecalho-conteudo">
                <div>
                    <h2 class="titulo-pagina">Detalhes do Motorista</h2>
                    <p class="subtitulo-pagina">Informações completas do motorista cadastrado.</p>
                </div>
                <div class="acoes-cabecalho">
                    <button type="button" class="botao-secundario" id="botaoVoltar">Voltar</button>
                    <button type="button" class="botao-primario" id="botaoEditar">Editar</button>
                </div>
            </section>

            <section class="painel-detalhes">
                <div class="grade-detalhes">
                    <div class="grupo-detalhe">
                        <span class="rotulo-detalhe">Nome completo</span>
                        <span class="valor-detalhe" id="detalheNome">—</span>
                    </div>

                    <div class="grupo-detalhe">
                        <span class="rotulo-detalhe">CPF</span>
                        <span class="valor-detalhe" id="detalheCpf">—</span>
                    </div>

                    <div class="grupo-detalhe">
                        <span class="rotulo-detalhe">Telefone</span>
                        <span class="valor-detalhe" id="detalheTelefone">—</span>
                    </div>

                    <div class="grupo-detalhe">
                        <span class="rotulo-detalhe">CNH</span>
                        <span class="valor-detalhe" id="detalheCnh">—</span>
                    </div>

                    <div class="grupo-detalhe">
                        <span class="rotulo-detalhe">Status</span>
                        <span class="valor-detalhe" id="detalheStatus">—</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

     <script src="/JavaScript/utils/navbar.js?v=2"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>


    <script src="/JavaScript/ver-motorista.js"></script>
</body>

</html>
