<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAcerto - Editar Motorista</title>
    <link rel="stylesheet" href="/CSS/editar-motorista.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="layout-principal">
        <aside class="barra-lateral"></aside>

        <main class="conteudo-principal">
            <header class="topo-pagina">
                <div class="acoes-topo">
                    <button class="botao-icone" type="button">🔔</button>
                    <div class="perfil-usuario">
                        <div class="avatar-usuario">GS</div>
                        <span class="nome-usuario">Gustavo</span>
                    </div>
                </div>
            </header>

            <section class="cabecalho-conteudo">
                <div>
                    <h2 class="titulo-pagina">Editar Motorista</h2>
                    <p class="subtitulo-pagina">Altere os dados do motorista e salve as modificações.</p>
                </div>
            </section>

            <section class="painel-formulario">
                <div id="formularioMotorista" class="formulario-motorista">
                    <div class="grade-formulario">
                        <div class="grupo-campo">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" maxlength="255"
                                required />
                        </div>

                        <div class="grupo-campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                                data-mascara="cpf" required />
                        </div>

                        <div class="grupo-campo">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                                maxlength="15" data-mascara="telefone" required />
                        </div>

                        <div class="grupo-campo">
                            <label for="cnh">CNH</label>
                            <input type="text" id="cnh" name="cnh" placeholder="Número da CNH" maxlength="11"
                                data-mascara="cnh" required />
                        </div>

                        <div class="grupo-campo">
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Selecione</option>
                                <option value="ativo">Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>
                    </div>

                    <div class="acoes-formulario">
                        <button type="button" class="botao-secundario" id="botaoCancelar">Cancelar</button>
                        <button type="button" class="botao-primario" id="botaoSalvarEdicao">Salvar alterações</button>
                    </div>

                    <div id="mensagemRetorno" class="mensagem-retorno"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="modalSucesso" class="modal-sucesso oculto">
        <div class="fundo-modal-sucesso"></div>
        <div class="caixa-modal-sucesso">
            <div class="icone-sucesso">✔</div>
            <h3>Motorista atualizado</h3>
            <p>As alterações foram salvas com sucesso.</p>

            <div class="acoes-modal-sucesso">
                <button type="button" class="botao-primario" id="botaoOkModal">OK</button>
            </div>
        </div>
    </div>

     <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
    <script src="/JavaScript/mascaras.js"></script>
    <script src="/JavaScript/editar-motorista.js"></script>
</body>

</html>
