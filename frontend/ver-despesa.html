<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Detalhes da Despesa</title>
  <link rel="stylesheet" href="/CSS/ver-despesa.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">??</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Detalhes da Despesa</h2>
          <p class="subtitulo-pagina">Consulte as informacoes registradas para esta despesa.</p>
        </div>
        <div class="acoes-formulario">
          <button type="button" class="botao-secundario" id="botaoVoltar">Voltar</button>
          <button type="button" class="botao-primario" id="botaoEditar" data-apenas-admin>Editar</button>
        </div>
      </section>

      <section class="painel-detalhes">
        <div class="grade-detalhes">
          <div class="item-detalhe">
            <span>Descricao</span>
            <strong id="detalheDescricao">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Categoria</span>
            <strong id="detalheCategoria">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Viagem</span>
            <strong id="detalheViagem">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Motorista</span>
            <strong id="detalheMotorista">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Veiculo</span>
            <strong id="detalheVeiculo">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Data</span>
            <strong id="detalheDataDespesa">-</strong>
          </div>
          <div class="item-detalhe">
            <span>Valor</span>
            <strong id="detalheValor">-</strong>
          </div>
          <div class="item-detalhe item-detalhe-largo">
            <span>Observacoes</span>
            <strong id="detalheObservacoes">-</strong>
          </div>
          <div class="item-detalhe item-detalhe-largo" id="blocoAnexoCupom">
            <span>Cupom fiscal</span>
            <div id="detalheAnexoCupom">Nenhum anexo.</div>
          </div>
        </div>
      </section>
    </main>
  </div>

   <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>


  <script src="/JavaScript/ver-despesa.js"></script>
</body>

</html>
