<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Detalhes do Veículo</title>
  <link rel="stylesheet" href="/frontend/CSS/ver-veiculo.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout-principal">
    <aside class="barra-lateral">
      <div class="logo-sistema">
        <div class="icone-logo">🚛</div>
        <h1 class="titulo-logo">AutoAcerto</h1>
      </div>

      <nav class="menu-lateral">
        <a href="home.html" class="item-menu">Dashboard</a>
        <a href="motoristas.html" class="item-menu">Motoristas</a>
        <a href="veiculos.html" class="item-menu ativo">Veículos</a>
        <a href="viagens.html" class="item-menu">Viagens</a>
        <a href="despesas.html" class="item-menu">Despesas</a>
        <a href="relatorios.html" class="item-menu">Relatórios</a>
        <a href="configuracoes.html" class="item-menu">Configurações</a>
      </nav>

      <div class="rodape-barra">
        <button class="botao-sair" type="button">Sair</button>
      </div>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Detalhes do Veículo</h2>
          <p class="subtitulo-pagina">Informações completas do veículo cadastrado.</p>
        </div>
        <div class="acoes-cabecalho">
          <button type="button" class="botao-secundario" id="botaoVoltar">Voltar</button>
          <button type="button" class="botao-primario" id="botaoEditar">Editar</button>
        </div>
      </section>

      <section class="painel-detalhes">
        <div class="grade-detalhes">
          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Modelo</span>
            <span class="valor-detalhe" id="detalheModelo">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Placa</span>
            <span class="valor-detalhe" id="detalhePlaca">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Tipo</span>
            <span class="valor-detalhe" id="detalheTipo">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Capacidade</span>
            <span class="valor-detalhe" id="detalheCapacidade">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Proprietário</span>
            <span class="valor-detalhe" id="detalheProprietario">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Status</span>
            <span class="valor-detalhe" id="detalheStatus">—</span>
          </div>

          <div class="grupo-detalhe grupo-detalhe-largo">
            <span class="rotulo-detalhe">Observações</span>
            <span class="valor-detalhe" id="detalheObservacoes">—</span>
          </div>

          <div class="grupo-detalhe">
            <span class="rotulo-detalhe">Data de cadastro</span>
            <span class="valor-detalhe" id="detalheDataCadastro">—</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/frontend/JavaScript/ver-veiculo.js"></script>
</body>
</html>
