<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Transportadora — AutoAcerto</title>
    <link rel="stylesheet" href="../CSS/transportadoras.css">
</head>
<body>
    <div class="container-principal">
        <div class="cabecalho-pagina">
            <h1>Editar Transportadora</h1>
            <button class="botao-voltar" onclick="window.location.href='transportadoras.html'">← Voltar</button>
        </div>

        <div class="cartao-formulario">
            <form id="formularioEditarTransportadora">
                <div class="grupo-campo">
                    <label for="campoNomeTransportadora">Nome da transportadora</label>
                    <input type="text" id="campoNomeTransportadora" required>
                </div>

                <div class="grupo-campo">
                    <label for="campoCnpjTransportadora">CNPJ</label>
                    <input type="text" id="campoCnpjTransportadora">
                </div>

                <div class="grupo-campo">
                    <label for="campoStatusTransportadora">Status</label>
                    <select id="campoStatusTransportadora" required>
                        <option value="true">Ativa</option>
                        <option value="false">Inativa</option>
                    </select>
                </div>

                <button type="submit" id="botaoSalvarEdicao" class="botao-primario">Salvar alterações</button>
            </form>
        </div>
    </div>

    <div id="toastTransportadora" class="toast-configuracao"></div>

    <script src="../JavaScript/editar-transportadora.js"></script>
</body>
</html>
