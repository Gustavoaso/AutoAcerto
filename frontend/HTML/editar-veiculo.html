        <a href="viagens.html" class="item-menu">

          </svg>
          Viagens

        <a href="despesas.html" class="item-menu">

          Configurações

      <div class="rodape-barra">
        <button class="botao-sair">Sair</button>
      </div>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Editar Veículo</h2>
          <p class="subtitulo-pagina">Altere os dados do veículo e salve as modificações.</p>
        </div>
      </section>

      <section class="painel-formulario">
        <div id="formularioVeiculo" class="formulario-veiculo">
          <div class="grade-formulario">

            <div class="grupo-campo">
              <label for="modelo">Modelo</label>
              <input type="text" id="modelo" name="modelo" placeholder="Ex: Volvo FH 540" required />
            </div>

            <div class="grupo-campo">
              <label for="placa">Placa</label>
              <input type="text" id="placa" name="placa" placeholder="AAA-0000 ou AAA0A00" maxlength="8"
                data-mascara="placa" required />
            </div>

            <div class="grupo-campo">
              <label for="status">Status</label>
              <select id="status" name="status" required>
                <option value="">Selecione</option>
                <option value="ativo">Ativo</option>
                <option value="em viagem">Em viagem</option>
                <option value="manutenção">Manutenção</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="ano">Ano de fabricação</label>
              <input type="number" id="ano" name="ano" placeholder="Ex: 2022" min="1950" max="2030" />
            </div>

            <div class="grupo-campo grupo-campo-largo">
              <label for="observacoes">Observações</label>
              <textarea id="observacoes" name="observacoes" rows="4"
                placeholder="Informações adicionais sobre o veículo"></textarea>
            </div>

          </div>

          <div class="acoes-formulario">
            <button type="button" class="botao-secundario" id="botaoCancelar">Cancelar</button>
            <button type="button" class="botao-primario" id="botaoSalvarEdicao">Salvar alterações</button>
          </div>

          <div id="mensagemRetorno" class="mensagem-retorno"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modalSucesso" class="modal-sucesso oculto">
    <div class="fundo-modal-sucesso"></div>
    <div class="caixa-modal-sucesso">
      <div class="icone-sucesso">✔</div>
      <h3>Veículo atualizado</h3>
      <p>As alterações foram salvas com sucesso.</p>
      <div class="acoes-modal-sucesso">
        <button type="button" class="botao-primario" id="botaoOkModal">OK</button>
      </div>
    </div>
  </div>

   <script src="../JavaScript/config.js"></script>
<script src="../JavaScript/auth.js"></script>
  <script src="../JavaScript/mascaras.js"></script>
  <script src="../JavaScript/editar-veiculo.js"></script></body>

</html>
