<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Cadastro de Veículo</title>
  <link rel="stylesheet" href="/frontend/CSS/cadastro-veiculo.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout-principal">
    <aside class="barra-lateral">
      <div class="logo-sistema">
        <div class="icone-logo">🚛</div>
        <h1 class="titulo-logo">AutoAcerto</h1>
      </div>
      <nav class="menu-lateral">
        <a href="home.html" class="item-menu">Dashboard</a>
        <a href="motoristas.html" class="item-menu">Motoristas</a>
        <a href="veiculos.html" class="item-menu ativo">Veículos</a>
        <a href="viagens.html" class="item-menu">Viagens</a>
        <a href="despesas.html" class="item-menu">Despesas</a>
        <a href="relatorios.html" class="item-menu">Relatórios</a>
        <a href="configuracoes.html" class="item-menu">Configurações</a>
      </nav>
      <div class="rodape-barra">
        <button class="botao-sair" type="button">Sair</button>
      </div>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Cadastrar Veículo</h2>
          <p class="subtitulo-pagina">Preencha os dados abaixo para cadastrar um novo veículo na frota.</p>
        </div>
      </section>

      <section class="painel-formulario">
        <div id="formularioVeiculo" class="formulario-veiculo">
          <div class="grade-formulario">

            <div class="grupo-campo">
              <label for="modelo">Modelo</label>
              <input type="text" id="modelo" name="modelo" placeholder="Ex: Volvo FH 540" required />
            </div>

            <div class="grupo-campo">
              <label for="placa">Placa</label>
              <input type="text" id="placa" name="placa" placeholder="AAA-0000 ou AAA0A00" maxlength="8" required />
            </div>

            <div class="grupo-campo">
              <label for="proprietario">Proprietário</label>
              <input type="text" id="proprietario" name="proprietario" placeholder="Nome do proprietário" required />
            </div>

            <div class="grupo-campo">
              <label for="status">Status</label>
              <select id="status" name="status" required>
                <option value="">Selecione</option>
                <option value="ativo">Ativo</option>
                <option value="em viagem">Em viagem</option>
                <option value="manutenção">Manutenção</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="ano">Ano de fabricação</label>
              <input type="number" id="ano" name="ano" placeholder="Ex: 2022" min="1950" max="2030" />
            </div>

            <div class="grupo-campo grupo-campo-largo">
              <label for="observacoes">Observações</label>
              <textarea id="observacoes" name="observacoes" rows="4"
                placeholder="Informações adicionais sobre o veículo"></textarea>
            </div>

          </div>

          <div class="acoes-formulario">
            <button type="button" class="botao-secundario" id="botaoLimpar">Limpar</button>
            <button type="button" class="botao-primario" id="botaoSalvarVeiculo">Salvar veículo</button>
          </div>

          <div id="mensagemRetorno" class="mensagem-retorno"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modalSucesso" class="modal-sucesso oculto">
    <div class="fundo-modal-sucesso"></div>
    <div class="caixa-modal-sucesso">
      <div class="icone-sucesso">✔</div>
      <h3>Veículo cadastrado</h3>
      <p>O veículo foi salvo com sucesso no sistema.</p>
      <div class="acoes-modal-sucesso">
        <button type="button" class="botao-primario" id="botaoOkModal">OK</button>
      </div>
    </div>
  </div>

  <script src="/frontend/JavaScript/cadastro-veiculo.js"></script>
</body>
</html>
