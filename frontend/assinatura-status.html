<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Status da assinatura</title>
  <link rel="icon" type="image/png" href="/Imagens/logo nova.png" />
  <link rel="stylesheet" href="/CSS/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="pagina-resetar-senha">
  <main class="layout-resetar-senha">
    <section class="caixa-resetar-senha caixa-status-assinatura">
      <div class="logo-container logo-container-reset">
        <img src="/Imagens/logo nova.png" alt="Logo AutoAcerto" class="logo-login">
        <span class="logo-texto"><span>Auto</span><strong>Acerto</strong></span>
      </div>

      <div class="cabecalho-login">
        <h1 class="titulo-login titulo-menor">Estamos confirmando sua assinatura</h1>
        <p class="subtitulo-login" id="textoStatusAssinatura">
          Assim que o Mercado Pago confirmar o pagamento, sua transportadora sera criada automaticamente.
        </p>
      </div>

      <div class="painel-status-assinatura" id="painelStatusAssinatura">
        <div class="selo-status-assinatura selo-pendente" id="seloStatusAssinatura">Aguardando confirmacao</div>
        <div class="detalhes-status-assinatura" id="detalhesStatusAssinatura"></div>
      </div>

      <div class="erro-geral" id="mensagemStatusAssinatura"></div>

      <div class="rodape-cartao-login">
        <a href="/login.html" id="linkEntrarAposAssinatura" class="oculto">Ir para o login</a>
        <a href="/assinar.html">Voltar para a assinatura</a>
      </div>
    </section>
  </main>

  <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/config.js"></script>
  <script src="/JavaScript/assinatura-status.js"></script>
</body>

</html>
