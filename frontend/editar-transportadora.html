<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Editar Transportadora</title>
  <link rel="stylesheet" href="/CSS/editar-transportadora.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Editar Transportadora</h2>
          <p class="subtitulo-pagina">Altere os dados da transportadora e salve as modificações.</p>
        </div>
        <div class="acoes-formulario">
          <button type="button" class="botao-secundario" id="botaoCancelar">Cancelar</button>
        </div>
      </section>

      <section class="painel-formulario">
        <div id="formularioTransportadora">
          <div class="grade-formulario">

            <div class="grupo-campo">
              <label for="campoNomeTransportadora">Nome da transportadora</label>
              <input type="text" id="campoNomeTransportadora" name="nome" placeholder="Ex: Transportadora Silva Ltda" required />
            </div>

            <div class="grupo-campo">
              <label for="campoCnpjTransportadora">CNPJ</label>
              <input type="text" id="campoCnpjTransportadora" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18"
                data-mascara="cnpj" autocomplete="off" />
            </div>

            <div class="grupo-campo">
              <label for="campoStatusTransportadora">Status</label>
              <select id="campoStatusTransportadora" name="status" required>
                <option value="">Selecione</option>
                <option value="true">Ativa</option>
                <option value="false">Inativa</option>
              </select>
            </div>

          </div>

          <div class="acoes-formulario">
            <!-- <button type="button" class="botao-secundario" id="botaoCancelar">Cancelar</button> -->
            <button type="button" class="botao-primario" id="botaoSalvarEdicao">Salvar alterações</button>
          </div>

          
          <div id="mensagemRetorno" class="mensagem-retorno"></div>

          <hr class="divisor-secao" />

          <section class="secao-admin-transportadora">
            <div class="cabecalho-admin">
              <h3 class="titulo-secao">Novo administrador</h3>
              <p class="subtitulo-secao">
                Crie um usuário administrador vinculado a esta transportadora.
              </p>
            </div>

            <div class="grade-formulario">

              <div class="grupo-campo">
                <label for="campoNomeAdmin">Nome completo</label>
                <input type="text" id="campoNomeAdmin" placeholder="Ex: João da Silva" />
              </div>

              <div class="grupo-campo">
                <label for="campoEmailAdmin">E-mail</label>
                <input type="email" id="campoEmailAdmin" placeholder="email@empresa.com" />
              </div>

              <div class="grupo-campo">
                <label for="campoSenhaAdmin">Senha</label>
                <input type="password" id="campoSenhaAdmin" placeholder="Mínimo 8 caracteres" />
              </div>

              <div class="grupo-campo">
                <label for="campoStatusAdmin">Status</label>
                <select id="campoStatusAdmin">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>

            </div>

            <div class="acoes-formulario">
              <button type="button" class="botao-primario" id="botaoCriarAdmin">
                Criar administrador
              </button>
            </div>

            <div id="mensagemRetornoAdmin" class="mensagem-retorno"></div>
          </section>

        </div>
      </section>
    </main>
  </div>

  <div id="modalSucesso" class="modal-sucesso oculto">
    <div class="fundo-modal-sucesso"></div>
    <div class="caixa-modal-sucesso">
      <div class="icone-sucesso">✔</div>
      <h3>Transportadora atualizada</h3>
      <p>As alterações foram salvas com sucesso.</p>
      <div class="acoes-modal-sucesso">
        <button type="button" class="botao-primario" id="botaoOkModal">OK</button>
      </div>
    </div>
  </div>

   <script src="/JavaScript/utils/navbar.js"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
  <script src="/JavaScript/mascaras.js"></script>
  <script src="/JavaScript/editar-transportadora.js"></script>
</body>

</html>
