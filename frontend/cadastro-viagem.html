<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAcerto - Cadastro de Viagem</title>
  <link rel="stylesheet" href="/CSS/cadastro-viagem.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="layout-principal">
    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div class="acoes-topo">
          <button class="botao-icone" type="button">🔔</button>
          <div class="perfil-usuario">
            <div class="avatar-usuario">GS</div>
            <span class="nome-usuario">Gustavo</span>
          </div>
        </div>
      </header>

      <section class="cabecalho-conteudo">
        <div>
          <h2 class="titulo-pagina">Cadastrar Viagem</h2>
          <p class="subtitulo-pagina">Preencha os dados abaixo para registrar uma nova viagem no sistema.</p>
        </div>
      </section>

      <section class="painel-formulario">
        <div id="formularioViagem" class="formulario-viagem">
          <div class="grade-formulario">

            <div class="grupo-campo">
              <label for="origem">Origem</label>
              <input type="text" id="origem" name="origem" placeholder="Ex: Betim, MG" autocomplete="off" required />
            </div>

            <div class="grupo-campo">
              <label for="destino">Destino</label>
              <input type="text" id="destino" name="destino" placeholder="Ex: São Paulo, SP" autocomplete="off" required />
            </div>

            <div class="grupo-campo">
              <label for="motoristaId">Motorista</label>
              <select id="motoristaId" name="motoristaId" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="veiculoId">Veículo</label>
              <select id="veiculoId" name="veiculoId" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="dataSaida">Data de saída</label>
              <input type="date" id="dataSaida" name="dataSaida" required />
            </div>

            <div class="grupo-campo">
              <label for="valorFrete">Valor do frete (R$)</label>
              <input type="text" id="valorFrete" name="valorFrete" placeholder="0,00" maxlength="18" inputmode="decimal"
                data-mascara="moeda" autocomplete="off" required />
            </div>

            <div class="grupo-campo">
              <label for="kmInicial">KM inicial da viagem</label>
              <input type="number" id="kmInicial" name="kmInicial" placeholder="Ex: 120000" min="0" step="1" required />
            </div>

            <div class="grupo-campo grupo-campo-largo">
              <label for="observacoes">Observações</label>
              <textarea id="observacoes" name="observacoes" rows="4"
                placeholder="Informações adicionais sobre a viagem"></textarea>
            </div>

          </div>

          <div class="acoes-formulario">
            <button type="button" class="botao-secundario" id="botaoLimpar">Limpar</button>
            <button type="button" class="botao-primario" id="botaoSalvarViagem">Salvar viagem</button>
          </div>

          <div id="mensagemRetorno" class="mensagem-retorno"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modalSucesso" class="modal-sucesso oculto">
    <div class="fundo-modal-sucesso"></div>
    <div class="caixa-modal-sucesso">
      <div class="icone-sucesso">✔</div>
      <h3>Viagem cadastrada</h3>
      <p>A viagem foi registrada com sucesso no sistema.</p>
      <div class="acoes-modal-sucesso">
        <button type="button" class="botao-primario" id="botaoOkModal">OK</button>
      </div>
    </div>
  </div>

   <script src="/JavaScript/utils/navbar.js?v=3"></script>
  <script src="/JavaScript/utils/formatar.js"></script>
  <script src="/JavaScript/utils/regras-negocio.js"></script>
  <script src="/JavaScript/config.js"></script>
<script src="/JavaScript/auth.js"></script>
  <script src="/JavaScript/master-contexto.js"></script>
  <script src="/JavaScript/mascaras.js"></script>
  <script src="/JavaScript/cidades-autocomplete.js"></script>
  <script src="/JavaScript/cadastro-viagem.js"></script></body>

</html>
